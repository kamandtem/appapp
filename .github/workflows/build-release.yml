name: Build signed Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name, for example 1.0.0
        required: true
        default: 1.0.0
      version_code:
        description: Positive integer, increase it for every Bazaar upload
        required: true
        default: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS is missing" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD is missing" && exit 1)

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript and build web app
        run: |
          npm run typecheck
          npm run build

      - name: Create and sync Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          node scripts/android-permissions.mjs

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/atelito-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/atelito-release.jks" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >/dev/null

      - name: Configure release
        env:
          ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code }}
        run: node scripts/android-release.mjs

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/atelito-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
            "out/atelito-${{ inputs.version_name }}-${{ inputs.version_code }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
            "out/atelito-${{ inputs.version_name }}-${{ inputs.version_code }}.aab"

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: atelito-signed-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
